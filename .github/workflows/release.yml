---
name: Release

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "custom_components/**"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    # Bump commits are pushed back, so only run against the default branch
    if: github.ref_name == github.event.repository.default_branch
    outputs:
      component_changed: ${{ steps.changes.outputs.component_changed }}
      component_version: ${{ steps.changes.outputs.component_version }}
      component_tag: ${{ steps.changes.outputs.component_tag }}
      previous_tag: ${{ steps.latest_release.outputs.LATEST_TAG }}
      release_sha: ${{ steps.changes.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest release
        id: latest_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare against the latest published release, not just any tag
          LATEST_TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Latest release: ${LATEST_TAG:-none}"

      - name: Detect changes
        id: changes
        run: |
          MANIFEST_FILE="custom_components/switch_energy_statistics_estimation/manifest.json"
          COMPONENT_PATH="custom_components/switch_energy_statistics_estimation/"
          COMPONENT_VERSION=$(grep '"version"' "$MANIFEST_FILE" | cut -d'"' -f4)
          LATEST_TAG="${{ steps.latest_release.outputs.LATEST_TAG }}"
          COMPONENT_CHANGED=false

          if [ -z "$LATEST_TAG" ]; then
            echo "No previous release found - initial release"
            COMPONENT_CHANGED=true
          elif [ -z "$(git diff --name-only "$LATEST_TAG" HEAD -- "$COMPONENT_PATH")" ]; then
            echo "No component changes since $LATEST_TAG"
          else
            COMPONENT_CHANGED=true
            RELEASED_VERSION="${LATEST_TAG#v}"
            HIGHEST=$(printf '%s\n%s\n' "$RELEASED_VERSION" "$COMPONENT_VERSION" | sort -V | tail -1)

            if [ "$COMPONENT_VERSION" != "$RELEASED_VERSION" ] && [ "$HIGHEST" = "$COMPONENT_VERSION" ]; then
              echo "Version bumped manually: $RELEASED_VERSION -> $COMPONENT_VERSION"
            else
              # Changes landed without a version bump: bump the patch version
              IFS=. read -r MAJOR MINOR PATCH <<< "$RELEASED_VERSION"
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "Version not bumped ($COMPONENT_VERSION), auto-bumping: $RELEASED_VERSION -> $NEW_VERSION"
              sed -i "s/\"version\": \"${COMPONENT_VERSION}\"/\"version\": \"${NEW_VERSION}\"/" "$MANIFEST_FILE"
              grep -q "\"version\": \"${NEW_VERSION}\"" "$MANIFEST_FILE"
              COMPONENT_VERSION="$NEW_VERSION"

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: bump version to ${NEW_VERSION}" -- "$MANIFEST_FILE"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi

            if git rev-parse -q --verify "refs/tags/v${COMPONENT_VERSION}" >/dev/null; then
              echo "::error::Tag v${COMPONENT_VERSION} already exists; bump the version in $MANIFEST_FILE"
              exit 1
            fi
          fi

          echo "component_changed=${COMPONENT_CHANGED}" >> $GITHUB_OUTPUT
          echo "component_version=${COMPONENT_VERSION}" >> $GITHUB_OUTPUT
          echo "component_tag=v${COMPONENT_VERSION}" >> $GITHUB_OUTPUT
          echo "release_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Component changed: ${COMPONENT_CHANGED}"
          echo "Component version: ${COMPONENT_VERSION}"

  release:
    needs: detect-changes
    if: needs.detect-changes.outputs.component_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.detect-changes.outputs.component_tag }}
          target_commitish: ${{ needs.detect-changes.outputs.release_sha }}
          name: >
            Switch Energy Statistics Estimation
            ${{ needs.detect-changes.outputs.component_version }}
          body: |
            ## Switch Energy Statistics Estimation
            v${{ needs.detect-changes.outputs.component_version }}

            ### What's Changed
            - Check the commit history for detailed changes
            - Updated to version
              ${{ needs.detect-changes.outputs.component_version }}

            ### Installation
            - Install via HACS (recommended)
            - Or download and copy to
              `custom_components/switch_energy_statistics_estimation/`

            ### Requirements
            - Home Assistant Core 2024.1+

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ needs.detect-changes.outputs.previous_tag }}...${{ needs.detect-changes.outputs.component_tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
